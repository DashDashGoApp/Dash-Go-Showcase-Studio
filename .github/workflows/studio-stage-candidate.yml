name: Studio Stage Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_origin:
        description: "Candidate source: manual pinned baseline, immutable Dash-Go stable release, or immutable native-contract beta release"
        required: false
        default: manual
        type: choice
        options:
          - manual
          - dashgo-stable-release
          - dashgo-beta-release
      dashgo_release_tag:
        description: Exact published immutable Dash-Go release tag (stable or beta release only)
        required: false
        type: string
      dashgo_version:
        description: Exact Dash-Go version without v (stable or beta release only)
        required: false
        type: string
      dashgo_source_sha256:
        description: Exact SHA-256 of Dash-Go source release asset (stable or beta release only)
        required: false
        type: string
      dashgo_tag_commit:
        description: Exact commit reached by the immutable Dash-Go release tag (stable or beta release only)
        required: false
        type: string
      dispatch_nonce:
        description: Unique dispatch correlation nonce (stable or beta release only)
        required: false
        type: string
      release_package_version:
        description: "Studio package identity: stable accepts Dash-Go X.Y.Z or X.Y.Z-rN; native beta accepts numeric core plus -test.N"
        required: false
        type: string

run-name: Studio stage ${{ inputs.candidate_origin }} Dash-Go ${{ inputs.release_package_version || inputs.dashgo_version || 'pinned' }} ${{ inputs.dispatch_nonce || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: studio-stage-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    name: Build and stage Linux plus Windows payloads
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out Studio source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up pinned Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false

      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          node --version
          go version
          dpkg-deb --version | head -n 1

      - name: Validate release-bridge contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_studio_stable_release_bridge.py --root .
          python3 tools/validate_studio_runtime_contract_matrix.py --root .
          python3 tools/test_showcase_runtime_contract.py
          python3 tools/test_stage_package_native_contract.py
          python3 tools/validate_studio_native_contract_beta.py --root .
          python3 tools/test_prepare_dashgo_release_beta.py

      - name: Materialize isolated candidate source
        id: candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_ORIGIN: ${{ inputs.candidate_origin }}
          DASHGO_RELEASE_TAG: ${{ inputs.dashgo_release_tag }}
          DASHGO_VERSION: ${{ inputs.dashgo_version }}
          DASHGO_SOURCE_SHA256: ${{ inputs.dashgo_source_sha256 }}
          DASHGO_TAG_COMMIT: ${{ inputs.dashgo_tag_commit }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          RELEASE_PACKAGE_VERSION: ${{ inputs.release_package_version }}
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/studio-candidate-source"
          origin_path="$RUNNER_TEMP/studio-candidate-origin.json"
          git worktree add --detach "$source_root" "$GITHUB_SHA"

          python3 tools/prepare_dashgo_release.py \
            --source-root "$source_root" \
            --origin-path "$origin_path" \
            --candidate-origin "$CANDIDATE_ORIGIN" \
            --dashgo-release-tag "$DASHGO_RELEASE_TAG" \
            --dashgo-version "$DASHGO_VERSION" \
            --dashgo-source-sha256 "$DASHGO_SOURCE_SHA256" \
            --dashgo-tag-commit "$DASHGO_TAG_COMMIT" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --release-package-version "$RELEASE_PACKAGE_VERSION"

          printf 'source_root=%s\n' "$source_root" >> "$GITHUB_OUTPUT"
          printf 'origin_path=%s\n' "$origin_path" >> "$GITHUB_OUTPUT"

      - name: Build staged package candidates
        shell: bash
        run: |
          set -euo pipefail
          candidate_source="${{ steps.candidate.outputs.source_root }}"
          candidate_origin="${{ steps.candidate.outputs.origin_path }}"
          chmod +x "$candidate_source/ci/package-ubuntu.sh"
          "$candidate_source/ci/package-ubuntu.sh" \
            "$RUNNER_TEMP/studio-stage" \
            "$RUNNER_TEMP/studio-stage-artifacts" \
            "$candidate_origin"
          cp "$candidate_origin" "$RUNNER_TEMP/studio-stage/candidate-origin-input.json"

      - name: Upload package-candidate artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: studio-stage-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/studio-stage-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload staging diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: studio-stage-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/studio-stage/
          if-no-files-found: warn
          retention-days: 7

      - name: Remove isolated candidate source
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git worktree remove --force "$RUNNER_TEMP/studio-candidate-source" || rm -rf "$RUNNER_TEMP/studio-candidate-source"
